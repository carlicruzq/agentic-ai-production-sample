name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the oldest version the code claims to support. If a test
        # only passes on the newest Node, the README is wrong, not the matrix.
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check every file
        run: find src test examples -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: test
        run: npm test
      - name: the demo has to actually run
        # A README example that stopped working two refactors ago is worse than
        # no example. It is checked like everything else.
        run: npm run demo

  no-network:
    name: the default path calls no API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t agentic-sample .
      - name: run the suite with no network at all
        # If anything in the tested path reached for an API, this fails.
        run: docker run --rm --network none agentic-sample
      - name: and the demo too
        run: docker run --rm --network none agentic-sample npm run demo

  dependencies:
    name: dependency-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the runtime has no dependencies
        # The claim on the tin, checked. `@anthropic-ai/sdk` is optional and
        # required lazily; nothing on the default path may pull anything in.
        run: |
          node -e '
            const p = require("./package.json");
            const deps = Object.keys(p.dependencies || {});
            if (deps.length) { console.error("unexpected dependencies:", deps); process.exit(1); }
            console.log("no runtime dependencies");
          '
